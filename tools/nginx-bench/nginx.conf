# Beneos Pruefstand: ein Reverse Proxy vor einer laufenden Foundry-Instanz,
# damit HTTP 413 gemessen statt behauptet wird.
#
#   Browser -> 127.0.0.1:8443 (dieser nginx) -> 127.0.0.1:30000 (Foundry, main)
#
# Der einzige veraenderliche Wert ist client_max_body_size, und er steht in
# einer eigenen Datei, damit ein Lauf sich vom naechsten in genau einer Zeile
# unterscheidet. Wechseln, dann `nginx -s reload`.
#
# Diese Datei und limit.conf gehoeren nach conf\ im entpackten nginx. Start und
# Stopp stehen in der README daneben; unter Windows laeuft nginx im Vordergrund
# und will deshalb ueber Start-Process losgeloest gestartet werden.

worker_processes  1;
error_log  logs/bench-error.log  warn;
pid        logs/bench.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  logs/bench-access.log;
    sendfile    on;

    # Der Schalter des Pruefstands. 1m ist der nginx-Standard und damit der
    # Zustand, in dem der Kunde seinen 413 bekommen hat.
    include     limit.conf;

    # Foundry haelt eine WebSocket-Verbindung. Ohne diese Zuordnung laedt die
    # Welt nicht, und dann misst der Pruefstand gar nichts.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       127.0.0.1:8443;
        server_name  localhost;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grosszuegig, damit ein abgebrochener Transfer nie an einer Zeitgrenze
        # dieses Pruefstands liegt statt an dem, was gemessen werden soll.
        proxy_connect_timeout  60s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;

        # proxy_request_buffering bleibt bewusst auf dem Standard an. Genau so
        # steht es beim Kunden, und nur so greift client_max_body_size.

        location / {
            proxy_pass http://127.0.0.1:30000;
        }
    }

    # Zweite Buehne: dieselbe Grenze vor der V14-Instanz. Zwei Fassungen sind
    # Messpflicht, und eine Buehne allein ist kein Ergebnis.
    server {
        listen       127.0.0.1:8444;
        server_name  localhost;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout  60s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;

        location / {
            proxy_pass http://127.0.0.1:30001;
        }
    }
}
