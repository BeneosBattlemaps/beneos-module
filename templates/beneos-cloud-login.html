<section class="bc-login-form">
  <p class="bc-login-form__hint">{{localize "BENEOS.Cloud.ConnectAccount.Description"}}</p>

  <div class="bc-login-form__field">
    <label for="email" class="bc-login-form__label">{{localize "BENEOS.Cloud.Login.EmailLabel"}}</label>
    <input type="email" id="email" name="email" required class="bc-login-form__input" autocomplete="email" />
  </div>

  {{!-- Passwordless: the emailed code logs in existing accounts and registers new
       ones, so there is no password field and no separate sign-up link. --}}
  <p class="bc-login-form__signup">{{localize "BENEOS.Cloud.ConnectAccount.NewAccountHint"}}</p>
</section>
